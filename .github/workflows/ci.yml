name: ci

on:
  push:
  pull_request:

jobs:
  unit-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and security tests
        run: sudo env PYTHONPATH=src PATH="$PATH" python -m unittest discover -s tests -v
